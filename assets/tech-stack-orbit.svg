<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="400" viewBox="0 0 400 400"
     xmlns="http://www.w3.org/2000/svg">

  <style>
    .orbit {
      transform-origin: 200px 200px;
      animation: spin 18s linear infinite;
    }

    .icon {
      transform-origin: center;
      animation: counter-spin 18s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    @keyframes counter-spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(-360deg); }
    }
  </style>

  <!-- Orbit Ring -->
  <g class="orbit">

    <!-- React -->
    <image href="icons/react.svg" x="185" y="20" width="30" height="30" class="icon"/>

    <!-- Next.js -->
    <image href="icons/nextjs.svg" x="300" y="90" width="30" height="30" class="icon"/>

    <!-- Node.js -->
    <image href="icons/nodejs.svg" x="330" y="185" width="30" height="30" class="icon"/>

    <!-- Express -->
    <image href="icons/express.svg" x="300" y="280" width="30" height="30" class="icon"/>

    <!-- MongoDB -->
    <image href="icons/mongodb.svg" x="185" y="330" width="30" height="30" class="icon"/>

    <!-- PostgreSQL -->
    <image href="icons/postgresql.svg" x="70" y="280" width="30" height="30" class="icon"/>

    <!-- JWT -->
    <image href="icons/jwt.svg" x="40" y="185" width="30" height="30" class="icon"/>

    <!-- Solidity -->
    <image href="icons/solidity.svg" x="70" y="90" width="30" height="30" class="icon"/>

  </g>

  <!-- Center -->
  <circle cx="200" cy="200" r="45" fill="#0f172a"/>
  <text x="200" y="205" text-anchor="middle"
        font-size="14" fill="#e5e7eb"
        font-family="Arial, Helvetica, sans-serif">
    Backend × On-chain
  </text>

</svg>
